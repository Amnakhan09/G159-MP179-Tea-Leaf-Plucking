apiVersion: apps/v1
kind: Deployment

metadata:
  name: mp179-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mp179-api

  template:
    metadata:
      labels:
        app: mp179-api

    spec:
      containers:
        - name: mp179-api
          image: mp179-api:1.0

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
